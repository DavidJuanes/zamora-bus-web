story:
  kicker: Features
  title: Everything you need at the stop
  intro: Six stops along the app. Scroll down and the phone shows you each screen.
  nearby:
    title: Near you
    text: Your favourite stops and the closest ones, with the next arrivals of every line.
    in: "in %m min"
    now: Arriving
    first_away: In real time
    first_then: then in 24 min
    second_away: In real time
    second_then: then in 33 min
    chips: [Updates by itself, Favourites with your own names, Search by number or name]
    alt: Nearby screen with favourite and nearby stops
  stop:
    title: Recognise your stop
    text: Every stop has its Street View photo, a compass that points the way, and the arrivals of all its lines.
    detail: Stop 153 · 30 m away, to the north
    chips: ["✎ Rename it: “Work”", ★ Favourite, Share]
    alt: Pza. Alemania stop detail with its photo
  lines:
    title: Every line
    text: Regular and special lines, with their outbound and return routes, their timetable and whether they're running right now. With the departure times of those with few trips and the stops only served at some hours.
    active: ● Running
    chips: [Every 20 min, Outbound and return, "Special: 5, 7 and 8"]
    alt: Route of line 1, Pza. Villardeciervos - Los Bloques
  map:
    title: The whole network on a map
    text: Every stop and the route of each line through the streets. Combine any lines you like and tap a stop to see its arrivals or walking directions.
    legend: The 7 lines
    chips: [137 stops, Walking directions, Dark mode]
    alt: Plan of the routes of Zamora's lines
  fares:
    title: Fares at hand
    text: Tickets and passes with their price, from the city's bylaw, so you know what suits you before you board.
    tickets:
      - { name: Single ticket, price: "€1.00" }
      - { name: 10-trip pass, price: "€0.70", unit: per trip }
      - { name: Monthly pass, price: "€45", unit: a month }
    chips: [Day pass, Senior and special passes, Free transfer within 60 min]
    alt: Fares screen
  yours:
    title: Your way
    text: Choose how to see arrival times, the theme and the language. Works with TalkBack and large text.
    toggle: "Arrival format: minutes or clock time"
    relative: in 2 min
    clock: "10:02"
    chips: [◐ Light and dark, ES · EN, Aa Large text, TalkBack]
    alt: Nearby screen in dark mode, with times in minutes

